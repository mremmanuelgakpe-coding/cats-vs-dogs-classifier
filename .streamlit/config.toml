[theme]
base = "light"
primaryColor = "#6C151E"
backgroundColor = "#F5DABF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2524"
font = "Montserrat, sans-serif"
headingFont = "Montserrat, sans-serif"
baseFontSize = 16

[[theme.fontFaces]]
family = "Montserrat"
url = "app/static/fonts/montserrat-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Montserrat"
url = "app/static/fonts/montserrat-latin-wght-italic.woff2"
weight = "100 900"
style = "italic"

[server]
headless = true
enableStaticServing = true
maxUploadSize = 8
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = false
