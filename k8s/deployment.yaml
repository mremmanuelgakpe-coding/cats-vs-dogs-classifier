apiVersion: apps/v1
kind: Deployment
metadata:
  name: catdog-api
  namespace: catdog
  labels: {app.kubernetes.io/name: catdog-api, app.kubernetes.io/version: "1.0.0"}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: catdog-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # aucune coupure pendant une mise à jour
  template:
    metadata:
      labels: {app.kubernetes.io/name: catdog-api}
    spec:
      automountServiceAccountToken: false              # l'API n'appelle pas l'API Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/mremmanuelgakpe-coding/cats-vs-dogs-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef: {name: catdog-api, key: api-key}
            - {name: MAX_CONCURRENT, value: "2"}
            - {name: OMP_NUM_THREADS, value: "1"}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
