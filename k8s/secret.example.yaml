# Modèle : ne jamais versionner la vraie clé. Créer le secret avec :
#   kubectl -n catdog create secret generic catdog-api --from-literal=api-key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
apiVersion: v1
kind: Secret
metadata:
  name: catdog-api
  namespace: catdog
type: Opaque
stringData:
  api-key: remplacer-par-une-cle-aleatoire
